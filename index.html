<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const td=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fd=s=>s?s.slice(8)+'/'+s.slice(5,7):'';
const n1=x=>Math.round(x*10)/10;
const LK='lbk_clienti_v2';
let S={clients:[]},V={t:'d'},M=null,NO=false,CT='p',db=null,base='',dirty=new Set(),tm;
try{S=JSON.parse(localStorage.getItem(LK))||S}catch(e){}
mig();
function sv(...ids){try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}ids.forEach(i=>dirty.add(i));clearTimeout(tm);tm=setTimeout(push,700)}
async function push(){
  if(!db)return;const ids=[...dirty];dirty.clear();
  try{await db.doc(base+'/idx').set({ids:S.clients.map(c=>c.id),pk:S.pk||[]})}catch(e){}
  for(const id of ids){try{const c=S.clients.find(x=>x.id===id),r=db.doc(base+'/c_'+id);if(c)await r.set({j:JSON.stringify(c)});else await r.delete()}catch(e){}}
}
const C=()=>S.clients.find(c=>c.id===V.c);
const PG=()=>{const c=C();return c&&c.progs.find(p=>p.id===V.pg)};
const D=()=>{const p=PG();return p&&(p.days.find(d=>d.id===V.d)||p.days[0])};
const vol=l=>Object.values(l.e).flat().reduce((a,x)=>a+(+x.w||0)*(+x.r||0),0);
function pts(d,x){return d.logs.slice().sort((a,b)=>a.date<b.date?-1:1).map(l=>{
  const s=(l.e[x.id]||[]).filter(k=>k.w>0&&k.r>0);
  return s.length?{d:l.date,w:Math.max(...s.map(k=>k.w)),m:Math.max(...s.map(k=>k.w*(1+(k.r>1?k.r/30:0))))}:null}).filter(Boolean)}
function ch(p){
  const W=300,H=90,P=14,ws=p.map(x=>x.w),mn=Math.min(...ws),mx=Math.max(...ws),r=mx-mn||1;
  const X=i=>P+(p.length<2?(W-2*P)/2:i*(W-2*P)/(p.length-1)),Y=v=>H-P-(v-mn)/r*(H-2*P-6);

  p.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.w)}" r="3.5" fill="var(--ac)"/>`+(lab?`<text x="${X(i)}" y="${Y(x.w)-7}" font-size="10" text-anchor="middle" fill="var(--tx)">${n1(x.w)}</text>`:'')).join('')+
  `<text x="${P}" y="${H+11}" font-size="10" fill="var(--mu)">${fd(p[0].d)}</text><text x="${W-P}" y="${H+11}" font-size="10" text-anchor="end" fill="var(--mu)">${fd(p[p.length-1].d)}</text></svg>`}
function homeOld(){
  return `<div class=w><div class=hd><h1>Clienti</h1><button class=p data-a=ac>+ Cliente</button></div>`+
  (S.clients.map(c=>{const ls=AD(c).flatMap(d=>d.logs).map(l=>l.date).sort(),last=ls[ls.length-1],ago=last?Math.max(0,Math.floor((new Date(td())-new Date(last))/864e5)):0;
    return `<div class="cd tap cl" data-a=oc data-i="${c.id}"><div class=av>${E((c.name.trim()[0]||'?').toUpperCase())}</div><b>${E(c.name)}</b><div class=mu>${c.progs.length} ${c.progs.length===1?'programma':'programmi'} · ${ls.length} sedute${last?` · ultima ${fd(last)} (${ago===0?'oggi':ago+' gg fa'})`:''}</div></div>`}).join('')||'<p class=mu>Nessun cliente. Premi "+ Cliente" per iniziare.</p>')+
  `<details class=cd><summary>Backup</summary><p class=mu>Scarica un file di backup sul telefono, oppure copia/incolla il testo.</p><textarea id=bkt></textarea><div class=row style="margin-top:8px"><button data-a=bkd>Scarica file</button><button data-a=bkf>Carica file</button></div><div class=row><button data-a=bke>Copia testo</button><button data-a=bki>Importa testo</button></div><input type=file id=bkfile accept=".json,application/json" hidden></details></div>`}
function chomeOld(c){
  const ls=AD(c).flatMap(d=>d.logs).map(l=>l.date).sort(),last=ls[ls.length-1],p=c.p||{},m=(c.m||[]).filter(x=>x.p).sort((a,b)=>a.date<b.date?-1:1),lm=m[m.length-1];
  const cd=(i,t,s)=>`<div class="cd tap" data-a=so data-i=${i}><b>${t}</b><div class=mu>${s}</div></div>`;
  return `<div class=w><div class=hd><button data-a=bh>←</button><h1 data-a=rc>${E(c.name)} ✎</h1><button data-a=rp>📤</button><button data-a=dup>⧉</button><button class=x data-a=dc>🗑</button></div>`+
  cd('p','👤 Profilo',E((p.ob||'Dati personali, salute, obiettivi').slice(0,60))+(p.cm&&p.cm<td()?' · ⚠ certificato scaduto':''))+
  cd('g','🏋️ Programmi',c.progs.length+(c.progs.length===1?' programma':' programmi')+' · '+ls.length+' sedute'+(last?' · ultima '+fd(last):''))+
  cd('m','📏 Misure',(c.m||[]).length?c.m.length+' misure'+(lm?' · peso '+n1(lm.p)+' kg':''):'Peso e circonferenze')+cd('ph','📸 Progressi (foto)',(c.ph||[]).length+' foto')+cd('ap','📅 Appuntamenti',(c.ap||[]).filter(a=>a.st==='Programmato'&&a.date>=td()).length+' in programma')+`</div>`}
